name: Deploy Backend to AWS Lambda

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

env:
  AWS_REGION: ap-southeast-2
  S3_BUCKET: neuroguide-deployments-tp19
  LAMBDA_FUNCTION: neuroguide-api

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest
        env:
          GEMINI_API_KEY: ""

  deploy:
    name: Deploy to Lambda
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build deployment package and ML layers
        run: bash scripts/build_lambda_package.sh
      - name: Upload artifacts to S3
        run: |
          aws s3 cp lambda_package.zip \
            "s3://$S3_BUCKET/lambda_package.zip" \
            --region "$AWS_REGION"
          aws s3 cp lambda_layer_scipy.zip \
            "s3://$S3_BUCKET/lambda_layer_scipy.zip" \
            --region "$AWS_REGION"
          aws s3 cp lambda_layer_ml.zip \
            "s3://$S3_BUCKET/lambda_layer_ml.zip" \
            --region "$AWS_REGION"
      - name: Publish ML Lambda layers
        id: layers
        run: |
          SCIPY_ARN=$(aws lambda publish-layer-version \
            --layer-name neuroguide-ml-scipy \
            --description "scipy for neuroguide-api" \
            --content "S3Bucket=$S3_BUCKET,S3Key=lambda_layer_scipy.zip" \
            --compatible-runtimes python3.11 \
            --region "$AWS_REGION" \
            --query LayerVersionArn --output text)
          ML_ARN=$(aws lambda publish-layer-version \
            --layer-name neuroguide-ml-stack \
            --description "numpy pandas sklearn for neuroguide-api" \
            --content "S3Bucket=$S3_BUCKET,S3Key=lambda_layer_ml.zip" \
            --compatible-runtimes python3.11 \
            --region "$AWS_REGION" \
            --query LayerVersionArn --output text)
          echo "scipy_arn=$SCIPY_ARN" >> "$GITHUB_OUTPUT"
          echo "ml_arn=$ML_ARN" >> "$GITHUB_OUTPUT"
          echo "Published layers: $SCIPY_ARN $ML_ARN"
      - name: Attach ML layers (before code so imports resolve on cold start)
        run: |
          aws lambda update-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --layers "${{ steps.layers.outputs.scipy_arn }}" "${{ steps.layers.outputs.ml_arn }}" \
            --region "$AWS_REGION"
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION"
      - name: Deploy function code from S3
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --s3-bucket "$S3_BUCKET" \
            --s3-key lambda_package.zip \
            --region "$AWS_REGION"
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION"
          echo "Deployed successfully"
